name: Verify ModelFoundry deployment and monitoring
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Training and profile unit tests
        run: |
          python -m unittest discover -s tests -p test_training.py -v
          python -m unittest discover -s tests -p test_ops_unit.py -v
      - name: HTTP and CLI integration tests
        run: |
          python -m unittest discover -s tests -p test_ops_integration.py -v
          python -m unittest discover -s tests -p test_ops_cli.py -v
      - name: Generate deployment evidence
        run: python -m modelops.demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelops-evidence-python-${{ matrix.python }}
          path: |
            runs/modelops-demo/evidence.json
            runs/modelops-demo/report.html
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: docker build -f Dockerfile.ops -t modelfoundry-ops:test .
      - name: Real container integration test
        env:
          MODELFOUNDRY_TEST_IMAGE: modelfoundry-ops:test
        run: python -m unittest discover -s tests -p test_ops_container.py -v
